name: Release

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      core_release_created: ${{ steps.release.outputs['packages/core--release_created'] }}
      core_version: ${{ steps.release.outputs['packages/core--version'] }}
      policy_release_created: ${{ steps.release.outputs['packages/policy--release_created'] }}
      policy_version: ${{ steps.release.outputs['packages/policy--version'] }}
      transports_release_created: ${{ steps.release.outputs['packages/transports--release_created'] }}
      transports_version: ${{ steps.release.outputs['packages/transports--version'] }}
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_version: ${{ steps.release.outputs['packages/cli--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

  publish:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@11.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir -p "$RUNNER_TEMP/npm-packages"
      - name: Publish core
        if: needs.release.outputs.core_release_created == 'true'
        working-directory: packages/core
        env:
          PACKAGE: "@mcp-restrictor/core"
          VERSION: ${{ needs.release.outputs.core_version }}
          TARBALL: mcp-restrictor-core-${{ needs.release.outputs.core_version }}.tgz
        run: |
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published"
            exit 0
          fi
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-packages"
          npm publish "$RUNNER_TEMP/npm-packages/$TARBALL" \
            --access public \
            --registry=https://registry.npmjs.org/
      - name: Publish policy
        if: needs.release.outputs.policy_release_created == 'true'
        working-directory: packages/policy
        env:
          PACKAGE: "@mcp-restrictor/policy"
          VERSION: ${{ needs.release.outputs.policy_version }}
          TARBALL: mcp-restrictor-policy-${{ needs.release.outputs.policy_version }}.tgz
        run: |
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published"
            exit 0
          fi
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-packages"
          npm publish "$RUNNER_TEMP/npm-packages/$TARBALL" \
            --access public \
            --registry=https://registry.npmjs.org/
      - name: Publish transports
        if: needs.release.outputs.transports_release_created == 'true'
        working-directory: packages/transports
        env:
          PACKAGE: "@mcp-restrictor/transports"
          VERSION: ${{ needs.release.outputs.transports_version }}
          TARBALL: mcp-restrictor-transports-${{ needs.release.outputs.transports_version }}.tgz
        run: |
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published"
            exit 0
          fi
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-packages"
          npm publish "$RUNNER_TEMP/npm-packages/$TARBALL" \
            --access public \
            --registry=https://registry.npmjs.org/
      - name: Publish CLI
        if: needs.release.outputs.cli_release_created == 'true'
        working-directory: packages/cli
        env:
          PACKAGE: "@mcp-restrictor/cli"
          VERSION: ${{ needs.release.outputs.cli_version }}
          TARBALL: mcp-restrictor-cli-${{ needs.release.outputs.cli_version }}.tgz
        run: |
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published"
            exit 0
          fi
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-packages"
          npm publish "$RUNNER_TEMP/npm-packages/$TARBALL" \
            --access public \
            --registry=https://registry.npmjs.org/

  publish_image:
    needs: release
    if: needs.release.outputs.cli_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve container tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.cli_version }}
        run: |
          {
            echo "value<<EOF"
            echo "type=raw,value=$VERSION"
            case "$VERSION" in
              *-*) ;;
              *)
                echo "type=raw,value=${VERSION%.*}"
                echo "type=raw,value=latest"
                ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/sw1tchdev/mcp-restrictor
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=MCP Restrictor
            org.opencontainers.image.description=Policy enforcement proxy for MCP clients
            org.opencontainers.image.source=https://github.com/sw1tchdev/mcp-restrictor
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.cli_version }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]' tz='UTC'}}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=MCP Restrictor
            org.opencontainers.image.description=Policy enforcement proxy for MCP clients
            org.opencontainers.image.source=https://github.com/sw1tchdev/mcp-restrictor
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.cli_version }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]' tz='UTC'}}
            org.opencontainers.image.licenses=MIT
      - name: Build and push container image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/sw1tchdev/mcp-restrictor
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
