name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build container image
        env:
          MCP_RESTRICTOR_TEST_IMAGE: mcp-restrictor-ci:${{ github.sha }}
        run: docker build --platform linux/amd64 --tag "$MCP_RESTRICTOR_TEST_IMAGE" .
      - name: Smoke container image
        env:
          MCP_RESTRICTOR_TEST_IMAGE: mcp-restrictor-ci:${{ github.sha }}
        run: pnpm run test:container
      - run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          for package in packages/core packages/policy packages/transports packages/cli; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/npm-packages")
          done
